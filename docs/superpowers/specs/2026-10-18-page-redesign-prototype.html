<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coptic Transliterator · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: "CS Ava Veni";
  src: url("../../../app/fonts/CSAvaVeni-Regular.ttf") format("truetype");
  font-display: swap;
}

:root {
  --ink: #141413;
  --paper: #faf9f5;
  --white: #ffffff;
  --ink-60: rgb(20 20 19 / 0.6);
  --ink-12: rgb(20 20 19 / 0.12);
  --ink-06: rgb(20 20 19 / 0.06);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --fast: 100ms;
  --base: 200ms;
  --slow: 800ms;
  --r-sm: 8px;
  --r-md: 16px;
  --r-lg: 24px;
  --shadow-card: rgba(0, 0, 0, 0.01) 0px 2px 2px 0px, rgba(0, 0, 0, 0.02) 0px 4px 4px 0px, rgba(0, 0, 0, 0.04) 0px 16px 24px 0px;
  --sans: "Hanken Grotesk", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --coptic: "CS Ava Veni", "Noto Sans Coptic", var(--sans);
  --latin-size: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- prototype stage (not part of the design) ---------- */
.stage { min-height: 100vh; }
.stage.phone { padding: 32px 16px 120px; background: #e8e6de; }
.app { container: app / inline-size; background: var(--paper); min-height: 100vh; }
.stage.phone .app {
  width: 390px; height: 780px; min-height: 0; margin: 0 auto; overflow-y: auto;
  border-radius: 44px; box-shadow: 0 0 0 10px #141413, 0 40px 80px rgb(0 0 0 / 0.18);
  scrollbar-width: none;
}
.proto {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 2px; padding: 4px;
  background: #2b2b29; color: #fff; border-radius: 999px;
  font: 500 13px/1 system-ui, sans-serif; box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
}
.proto button {
  background: transparent; border: 0; color: #fff; padding: 9px 14px;
  border-radius: 999px; cursor: pointer;
}
.proto button[aria-pressed="true"] { background: #fff; color: #141413; }
.proto .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 0.2); margin: 0 4px; }
.proto .note { opacity: 0.55; padding: 0 12px 0 8px; }

/* ---------- page ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 44px 16px 120px; }
.intro { margin-bottom: 22px; }
h1 {
  font-size: clamp(40px, 9cqi, 58px); line-height: 1.1; font-weight: 700;
  letter-spacing: -0.02em; margin: 0 0 16px; text-wrap: balance;
}
.intro p {
  font-size: 17px; line-height: 1.5; color: var(--ink-60);
  max-width: 44ch; margin: 0; text-wrap: pretty;
}

.workspace { display: grid; gap: 22px; }

/* composer */
.composer {
  border: 1px solid var(--ink); border-radius: var(--r-md); background: var(--paper);
  transition: box-shadow var(--base) var(--ease);
}
.composer:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.composer textarea {
  display: block; width: 100%; min-height: 200px; max-height: 60vh; field-sizing: content;
  resize: none; border: 0; outline: none; background: transparent; color: var(--ink);
  padding: 22px 22px 8px; font-family: var(--coptic); font-size: 22px; line-height: 1.6;
}
.composer textarea::placeholder { font-family: var(--sans); font-size: 18px; color: var(--ink-60); }
.bar {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  min-height: 68px; padding: 8px 12px 12px 22px;
}
.count { margin-right: auto; font: 400 12px/1.4 var(--mono); color: var(--ink-60); }
.count.over { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.kbd { display: none; font: 400 12px/1.4 var(--mono); color: var(--ink-60); margin-right: 4px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px;
  border: 0; border-radius: var(--r-sm); cursor: pointer; font: 500 15px/1 var(--sans);
  transition: opacity var(--base) var(--ease), transform var(--base) var(--ease), background-color var(--fast) var(--ease);
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primary { background: var(--ink); color: var(--white); }
.btn-primary:hover { opacity: 0.86; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { cursor: progress; opacity: 0.7; }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--ink-06); }
.btn:focus-visible, .example:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.reveal {
  opacity: 0; transform: translateY(6px); visibility: hidden; pointer-events: none;
  transition: opacity var(--base) var(--ease), transform var(--base) var(--ease), visibility 0s linear var(--base);
}
.has-text .reveal {
  opacity: 1; transform: none; visibility: visible; pointer-events: auto;
  transition: opacity var(--base) var(--ease), transform var(--base) var(--ease), visibility 0s;
}
.has-text .btn-primary.reveal:disabled { opacity: 0.7; }

.dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* error */
.error {
  display: flex; align-items: center; gap: 8px; margin: 12px 0 0;
  font-size: 15px; line-height: 1.4;
}
.error[hidden] { display: none; }
.error svg { width: 18px; height: 18px; flex: none; }
.link {
  background: none; border: 0; padding: 0 4px; height: 44px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; font-weight: 500;
}

/* result */
.result { margin-top: 36px; --lh: 1.55; }
.result[hidden] { display: none; }
.result-head {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--ink); padding-top: 8px; margin-bottom: 16px;
}
.label { font: 400 12px/1.4 var(--mono); color: var(--ink-60); }
.latin {
  margin: 0; font-size: var(--latin-size); line-height: var(--lh); letter-spacing: -0.01em;
}
.latin[hidden] { display: none; }
.latin .ln { display: block; min-height: calc(var(--lh) * 1em); animation: rise var(--base) var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }

.sk { font-size: var(--latin-size); }
.sk[hidden] { display: none; }
.sk-row { height: calc(var(--lh) * 1em); display: flex; align-items: center; }
.sk-bar {
  height: 0.5em; border-radius: 999px; background: var(--ink); opacity: 0.07;
  animation: pulse 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * 80ms);
}
@keyframes pulse { 50% { opacity: 0.14; } }

/* examples */
.examples h2 { font: 400 12px/1.4 var(--mono); color: var(--ink-60); margin: 0 0 12px; }
.ex-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.example {
  display: flex; align-items: center; height: 44px; padding: 0 16px; cursor: pointer;
  background: transparent; border: 1px solid var(--ink-12); border-radius: 999px; text-align: left;
  transition: border-color var(--fast) var(--ease), box-shadow var(--base) var(--ease), background-color var(--fast) var(--ease);
}
.example:hover { border-color: var(--ink); box-shadow: var(--shadow-card); }
.example[aria-pressed="true"] { border-color: var(--ink); background: var(--white); }
.ex-title { font: 500 15px/1.3 var(--sans); }
.ex-coptic { display: none; }

@container app (min-width: 768px) {
  .page { padding: 68px 32px 140px; }
  .intro { margin-bottom: 58px; }
  .intro p { font-size: 18px; }
  .workspace { grid-template-columns: minmax(0, 1fr) 248px; gap: 58px; align-items: start; }
  .examples { position: sticky; top: 32px; grid-column: 2; grid-row: 1; }
  .primary { grid-column: 1; grid-row: 1; }
  .composer textarea { min-height: 280px; }
  .kbd { display: inline; }
  .result { margin-top: 58px; --latin-size: 26px; }
  .ex-list { display: grid; gap: 8px; }
  .example {
    display: grid; gap: 4px; width: 100%; height: auto; padding: 12px 16px;
    border-radius: var(--r-md);
  }
  .ex-coptic {
    display: block; font: 17px/1.4 var(--coptic); color: var(--ink-60);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  .sk-bar { animation: none; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="app" id="app">
    <main class="page">
      <header class="intro">
        <h1>Read Coptic aloud.</h1>
        <p>Paste Bohairic Coptic and get it back in Latin letters, spelled the way it&rsquo;s said in church.</p>
      </header>

      <div class="workspace">
        <div class="primary">
          <form class="composer" id="composer">
            <label class="sr-only" for="coptic">Coptic text</label>
            <textarea id="coptic" lang="cop" spellcheck="false" placeholder="Paste or type Coptic text"></textarea>
            <div class="bar">
              <span class="count" id="count" aria-live="polite"></span>
              <span class="kbd reveal" aria-hidden="true">&#8984; Enter</span>
              <button type="button" class="btn btn-ghost reveal" id="clear">Clear</button>
              <button type="submit" class="btn btn-primary reveal" id="go">
                <span id="go-label">Transliterate</span>
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
              </button>
            </div>
          </form>

          <p class="error" id="error" role="alert" hidden>
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="9" r="7.25"/><path d="M9 5.5v4.25M9 12.25v.01"/></svg>
            <span id="error-text"></span>
            <button type="button" class="link" id="retry">Try again</button>
          </p>

          <section class="result" id="result" aria-live="polite" aria-labelledby="latin-label" hidden>
            <div class="result-head">
              <span class="label" id="latin-label">Latin</span>
              <button type="button" class="btn btn-ghost" id="copy">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.25" y="5.25" width="8" height="8" rx="1.5"/><path d="M10.75 5.25V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1.75"/></svg>
                <span id="copy-label">Copy</span>
              </button>
            </div>
            <div class="sk" id="skeleton" aria-hidden="true"></div>
            <p class="latin" id="latin" hidden></p>
          </section>
        </div>

        <aside class="examples" aria-labelledby="ex-heading">
          <h2 id="ex-heading">No Coptic on hand? Try one.</h2>
          <ul class="ex-list">
            <li><button type="button" class="example" data-id="risen" aria-pressed="false"><span class="ex-title">Christ is risen</span><span class="ex-coptic" lang="cop">Ⲡⲓⲭ̀ⲣⲓⲥⲧⲟⲥ ⲁϥⲧⲱⲛϥ</span></button></li>
            <li><button type="button" class="example" data-id="name" aria-pressed="false"><span class="ex-title">In the name of the Father</span><span class="ex-coptic" lang="cop">Ϧⲉⲛ ⲫ̀ⲣⲁⲛ ⲙ̀ⲫ̀ⲓⲱⲧ</span></button></li>
            <li><button type="button" class="example" data-id="prayer" aria-pressed="false"><span class="ex-title">The Lord&rsquo;s Prayer</span><span class="ex-coptic" lang="cop">Ϫⲉ ⲡⲉⲛⲓⲱⲧ ⲉⲧϧⲉⲛ ⲛⲓⲫⲏⲟⲩⲓ</span></button></li>
            <li><button type="button" class="example" data-id="conclusion" aria-pressed="false"><span class="ex-title">Through the intercessions</span><span class="ex-coptic" lang="cop">Ϩⲓⲧⲉⲛ ⲛⲓⲡ̀ⲣⲉⲥⲃⲓⲁ</span></button></li>
          </ul>
        </aside>
      </div>
    </main>
  </div>
</div>

<div class="proto" role="group" aria-label="Prototype controls">
  <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
  <button type="button" data-view="phone" aria-pressed="false">Phone</button>
  <span class="sep"></span>
  <button type="button" id="sim-error" aria-pressed="false">Simulate error</button>
  <span class="note">Prototype &middot; canned output</span>
</div>

<script>
const EXAMPLES = {
  risen: {
    coptic: "Ⲡⲓⲭ̀ⲣⲓⲥⲧⲟⲥ ⲁϥⲧⲱⲛϥ\nϦⲉⲛ ⲟⲩⲙⲉⲑⲙⲏⲓ ⲁϥⲧⲱⲛϥ",
    latin: "Pikhristos aftonf\nKhen oumethmee aftonf",
  },
  name: {
    coptic: "Ϧⲉⲛ ⲫ̀ⲣⲁⲛ ⲙ̀ⲫ̀ⲓⲱⲧ\nⲛⲉⲙ ⲡ̀ϣⲏⲣⲓ\nⲛⲉⲙ Ⲡⲓⲡⲛⲉⲩⲙⲁ ⲉⲑⲟⲩⲁⲃ\nⲟⲩⲛⲟⲩϯ ⲛ̀ⲟⲩⲱⲧ Ⲁⲙⲏⲛ.",
    latin: "Khen efran emefyot\nnem epsheeri\nnem Pipnevma ethouab\nounouti enouot Amen.",
  },
  prayer: {
    coptic: "Ϫⲉ ⲡⲉⲛⲓⲱⲧ ⲉⲧϧⲉⲛ ⲛⲓⲫⲏⲟⲩⲓ: ⲙⲁⲣⲉϥⲧⲟⲩⲃⲟ ⲛ̀ϫⲉ ⲡⲉⲕⲣⲁⲛ: ⲙⲁⲣⲉⲥⲓ ⲛ̀ϫⲉ ⲧⲉⲕⲙⲉⲧⲟⲩⲣⲟ: ⲡⲉⲧⲉϩⲛⲁⲕ ⲙⲁⲣⲉϥϣⲱⲡⲓ\nⲘ̀ⲫⲣⲏϯ ϧⲉⲛ ⲧ̀ⲫⲉ ⲛⲉⲙ ϩⲓϫⲉⲛ ⲡⲓⲕⲁϩⲓ: ⲡⲉⲛⲱⲓⲕ ⲛ̀ⲧⲉ ⲣⲁⲥϯ ⲙⲏⲓϥ ⲛⲁⲛ ⲙ̀ⲫⲟⲟⲩ:\nⲞⲩⲟϩ ⲭⲁ ⲛⲏⲉⲧⲉⲣⲟⲛ ⲛⲁⲛ ⲉ̀ⲃⲟⲗ: ⲙ̀ⲫ̀ⲣⲏϯ ϩⲱⲛ ⲛ̀ⲧⲉⲛⲭⲱ ⲉ̀ⲃⲟⲗ ⲛ̀ⲛⲏⲉⲧⲉ ⲟⲩⲟⲛ ⲛ̀ⲧⲁⲛ ⲉⲣⲱⲟⲩ:\nⲞⲩⲟϩ ⲙ̀ⲡⲉⲣⲉⲛⲧⲉⲛ ⲉϧⲟⲩⲛ ⲉ̀ⲡⲓⲣⲁⲥⲙⲟⲥ: ⲁⲗⲗⲁ ⲛⲁϩⲙⲉⲛ ⲉⲃⲟⲗϩⲁ ⲡⲓⲡⲉⲧϩⲱⲟⲩ:\nϦⲉⲛ Ⲡⲭ̅ⲥ̅ Ⲓⲏ̅ⲥ̅ Ⲡⲉⲛⲟ̅ⲥ̅.\nϪⲉ ⲑⲱⲕ ⲧⲉ ϯⲙⲉⲧⲟⲩⲣⲟ ⲛⲉⲙ ϯϫⲟⲙ\nⲛⲉⲙ ⲡⲓⲱⲟⲩ ϣⲁ ⲉⲛⲉϩ. Ⲁⲙⲏⲛ.",
    latin: "Je penyot etkhen nifeeoui: mareftouvo enje pekran: maresi enje tekmetouro: petehnak marefshopi\nEmfreeti khen etfe nem hijen pikahi: penoik ente rasti meef nan emfoou:\nOuoh ka neeeteron nan evol: emefreeti hon entenko evol enneeete ouon entan eroou:\nOuoh emperenten ekhoun epirasmos: alla nahmen evolha pipethoou:\nKhen Pikhristos Isos Penchois.\nJe thok te timetouro nem tigom\nnem pioou sha eneh. Amen.",
  },
  conclusion: {
    coptic: "Ϩⲓⲧⲉⲛ ⲛⲓⲡ̀ⲣⲉⲥⲃⲓⲁ:\nⲛ̀ⲧⲉ Ϯⲑⲉⲟ̀ⲧⲟⲕⲟⲥ ⲉⲑⲟⲩⲁⲃ Ⲙⲁⲣⲓⲁ:\nⲠ̀ϭⲟⲓⲥ ⲁ̀ⲣⲓϩ̀ⲙⲟⲧ ⲛⲁⲛ:\nⲙ̀ⲡⲓⲭⲱ ⲉ̀ⲃⲟⲗ ⲛ̀ⲧⲉ ⲛⲉⲛⲛⲟⲃⲓ.",
    latin: "Hiten nipresvia:\nente Titheotokos ethouab Maria:\nEpchois arihmot nan:\nempiko evol ente nennovi.",
  },
};

// Crude letter map so typed text gets *something* back in the prototype.
const MAP = { "ⲁ":"a","ⲃ":"v","ⲅ":"gh","ⲇ":"th","ⲉ":"e","ⲍ":"z","ⲏ":"ee","ⲑ":"th","ⲓ":"i","ⲕ":"k","ⲗ":"l","ⲙ":"m","ⲛ":"n","ⲝ":"x","ⲟ":"o","ⲡ":"p","ⲣ":"r","ⲥ":"s","ⲧ":"t","ⲩ":"i","ⲫ":"f","ⲭ":"kh","ⲯ":"ps","ⲱ":"o","ϣ":"sh","ϥ":"f","ϧ":"kh","ϩ":"h","ϫ":"j","ϭ":"ch","ϯ":"ti" };
function rough(text) {
  const chars = [...text.normalize("NFC").replace(/[̀̄̅̿︤-︦]/g, "")];
  let out = "";
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i], lo = ch.toLowerCase(), next = (chars[i + 1] || "").toLowerCase();
    let piece = lo === "ⲟ" && next === "ⲩ" ? (i++, "ou") : MAP[lo] ?? ch;
    if (ch !== lo) piece = piece.charAt(0).toUpperCase() + piece.slice(1);
    out += piece;
  }
  return out;
}

const LIMIT = 1000;
const $ = (s) => document.querySelector(s);
const stage = $("#stage"), app = $("#app"), form = $("#composer"), ta = $("#coptic");
const count = $("#count"), go = $("#go"), goLabel = $("#go-label"), clearBtn = $("#clear");
const result = $("#result"), sk = $("#skeleton"), latin = $("#latin");
const err = $("#error"), errText = $("#error-text"), copyBtn = $("#copy"), copyLabel = $("#copy-label");
const exampleBtns = [...document.querySelectorAll(".example")];
let runId = 0, simulateError = false, lastText = "";

function sync() {
  form.classList.toggle("has-text", ta.value.trim() !== "");
  const n = [...ta.value].length;
  count.textContent = n >= LIMIT * 0.8 ? `${n.toLocaleString()} / ${LIMIT.toLocaleString()}` : "";
  count.classList.toggle("over", n > LIMIT);
}
function selectExample(btn) {
  exampleBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function setLoading(on) {
  go.disabled = on;
  goLabel.textContent = on ? "Transliterating" : "Transliterate";
  goLabel.classList.toggle("dots", on);
  result.setAttribute("aria-busy", String(on));
  copyBtn.disabled = on;
  copyBtn.style.visibility = on ? "hidden" : "visible";
}
function showError(message) {
  errText.textContent = message;
  err.hidden = false;
}
function renderSkeleton(text) {
  const lines = text.split("\n").slice(0, 14);
  const longest = Math.max(...lines.map((l) => [...l].length), 1);
  sk.innerHTML = lines.map((l, i) => {
    const len = [...l.trim()].length;
    if (!len) return `<div class="sk-row"></div>`;
    const pct = Math.max(28, Math.min(100, Math.round((len / longest) * 100)));
    return `<div class="sk-row"><div class="sk-bar" style="width:${pct}%;--i:${i}"></div></div>`;
  }).join("");
}

function run(text) {
  if (!text.trim()) return;
  const n = [...text].length;
  if (n > LIMIT) {
    showError(`That’s ${n.toLocaleString()} characters. Try a passage under ${LIMIT.toLocaleString()}.`);
    return;
  }
  const id = ++runId;
  lastText = text;
  err.hidden = true;
  result.hidden = false;
  latin.hidden = true;
  renderSkeleton(text);
  sk.hidden = false;
  setLoading(true);
  if (app.clientWidth < 768) result.scrollIntoView({ behavior: "smooth", block: "start" });

  setTimeout(() => {
    if (id !== runId) return;
    setLoading(false);
    sk.hidden = true;
    if (simulateError) {
      result.hidden = true;
      showError("Something went wrong on our side.");
      return;
    }
    const match = Object.values(EXAMPLES).find((e) => e.coptic.trim() === text.trim());
    const out = match ? match.latin : rough(text);
    latin.innerHTML = out.split("\n")
      .map((l, i) => `<span class="ln" style="--i:${i}">${escapeHtml(l) || "&nbsp;"}</span>`)
      .join("");
    latin.hidden = false;
  }, 1300 + Math.random() * 700);
}

ta.addEventListener("input", () => { sync(); selectExample(null); });
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", (e) => { e.preventDefault(); if (!go.disabled) run(ta.value); });
clearBtn.addEventListener("click", () => {
  runId++;
  setLoading(false);
  ta.value = "";
  lastText = "";
  sync();
  selectExample(null);
  err.hidden = true;
  result.hidden = true;
  latin.innerHTML = "";
  ta.focus();
});
$("#retry").addEventListener("click", () => run(lastText || ta.value));
exampleBtns.forEach((btn) => btn.addEventListener("click", () => {
  ta.value = EXAMPLES[btn.dataset.id].coptic;
  sync();
  selectExample(btn);
  run(ta.value);
}));
copyBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(latin.innerText); } catch {}
  copyLabel.textContent = "Copied";
  setTimeout(() => (copyLabel.textContent = "Copy"), 1600);
});

document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  stage.classList.toggle("phone", b.dataset.view === "phone");
  document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
$("#sim-error").addEventListener("click", (e) => {
  simulateError = !simulateError;
  e.currentTarget.setAttribute("aria-pressed", String(simulateError));
});
sync();
</script>
</body>
</html>
